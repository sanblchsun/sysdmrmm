<!-- app/templates/rdp_view.html -->
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>RDP — {{ name_pc }}</title>
    <meta
      name="rdp-config"
      data-machine-uid="{{ machine_uid }}"
      data-rmm-prefix="/rmm"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        color: #9f9;
        font: 12px monospace;
      }
      #container,
      #media {
        width: 100vw;
        height: 100vh;
      }
      #media {
        display: block;
        object-fit: contain;
        background: #000;
      }
      .hud {
        position: fixed;
        top: 8px;
        left: 8px;
        background: rgba(0, 0, 0, 0.45);
        padding: 4px 8px;
        border-radius: 4px;
      }
      .err {
        position: fixed;
        top: 8px;
        right: 8px;
        background: rgba(120, 0, 0, 0.6);
        padding: 4px 8px;
        border-radius: 4px;
        color: #fff;
      }
      .ctrl {
        position: fixed;
        bottom: 8px;
        left: 8px;
        background: rgba(0, 0, 0, 0.45);
        padding: 4px 8px;
        border-radius: 4px;
      }
      .cfg {
        position: fixed;
        bottom: 8px;
        right: 8px;
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 10px;
        border-radius: 4px;
        color: #eee;
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 11px;
      }
      .cfg select,
      .cfg input,
      .cfg button {
        background: #222;
        color: #eee;
        border: 1px solid #333;
        border-radius: 3px;
        padding: 2px 4px;
        font: inherit;
      }
      .cfg input {
        width: 50px;
      }
      .cfg button {
        cursor: pointer;
        background: #2a3b2a;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div class="hud" id="hud">loading…</div>
    <div class="err" id="err" style="display: none"></div>
    <div class="ctrl" id="ctrl">ctrl: —</div>
    <div class="cfg" id="cfg">
      <label
        >codec
        <select name="codec">
          <option value="mjpeg">MJPEG</option>
          <option value="h264">H.264</option>
        </select>
      </label>
      <label
        >fps <input name="fps" type="number" min="1" max="120" value="30"
      /></label>
      <label
        >q <input name="mjpeg_q" type="number" min="2" max="31" value="4"
      /></label>
      <label>br <input name="bitrate" value="4M" /></label>
      <button id="apply">Apply</button>
    </div>

    <script type="module">
      const META = document.querySelector('meta[name="rdp-config"]');
      const AID = META.getAttribute("data-machine-uid");
      const RMM_PREFIX = META.getAttribute("data-rmm-prefix") || "/rmm";

      const hud = document.getElementById("hud");
      const err = document.getElementById("err");
      const ctl = document.getElementById("ctrl");
      const box = document.getElementById("container");

      function showErr(t) {
        err.style.display = "block";
        err.textContent = t;
      }

      async function apiPost(u, body) {
        const r = await fetch(u, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(body),
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }

      async function getCurrent() {
        const r = await fetch(RMM_PREFIX + "/agents", {
          credentials: "include",
        });
        if (!r.ok) return null;
        const d = await r.json();
        return (d.agents || []).find((a) => a.id === AID) || null;
      }

      document.getElementById("apply").onclick = async () => {
        const get = (n) => document.querySelector('[name="' + n + '"]').value;
        try {
          await apiPost(
            RMM_PREFIX + "/agents/" + encodeURIComponent(AID) + "/config",
            {
              codec: get("codec"),
              fps: parseInt(get("fps"), 10),
              mjpeg_q: parseInt(get("mjpeg_q"), 10),
              bitrate: get("bitrate"),
            },
          );
        } catch (e) {
          showErr("cfg: " + e.message);
        }
      };

      // ========= CONTROL =========
      let ctrlWs = null;
      let agentScreen = null;
      let lastMove = 0;
      const MOUSE_MOVE_HZ = 100;
      const heldKeys = new Set();
      let lastPasteText = "";

      function openCtrlWS() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        ctrlWs = new WebSocket(
          proto +
            "://" +
            location.host +
            RMM_PREFIX +
            "/ws/control/viewer/" +
            encodeURIComponent(AID),
        );
        ctrlWs.onopen = () => (ctl.textContent = "ctrl: connected");
        ctrlWs.onclose = () => {
          ctl.textContent = "ctrl: offline";
          heldKeys.clear();
          ctrlWs = null;
          setTimeout(openCtrlWS, 2000);
        };
        ctrlWs.onerror = () => {
          try {
            ctrlWs.close();
          } catch (e) {}
        };
        ctrlWs.onmessage = (ev) => {
          let d;
          try {
            d = JSON.parse(ev.data);
          } catch (e) {
            return;
          }
          if (d.type === "hello") {
            agentScreen = { w: d.screen_w | 0, h: d.screen_h | 0 };
            ctl.textContent = "ctrl: " + agentScreen.w + "×" + agentScreen.h;
          } else if (d.type === "clipboard") {
            if (
              d.text &&
              navigator.clipboard &&
              navigator.clipboard.writeText
            ) {
              navigator.clipboard.writeText(d.text).catch(() => {});
            }
          }
        };
      }
      function sendCtrl(obj) {
        if (ctrlWs && ctrlWs.readyState === 1) ctrlWs.send(JSON.stringify(obj));
      }

      function mapToScreen(el, cx, cy, mediaW, mediaH) {
        if (!mediaW || !mediaH) return null;
        const rect = el.getBoundingClientRect();
        const lx = cx - rect.left,
          ly = cy - rect.top;
        const er = rect.width / rect.height,
          mr = mediaW / mediaH;
        let dW,
          dH,
          oX = 0,
          oY = 0;
        if (er > mr) {
          dH = rect.height;
          dW = dH * mr;
          oX = (rect.width - dW) / 2;
        } else {
          dW = rect.width;
          dH = dW / mr;
          oY = (rect.height - dH) / 2;
        }
        const xi = lx - oX,
          yi = ly - oY;
        if (xi < 0 || yi < 0 || xi > dW || yi > dH) return null;
        const sW = agentScreen ? agentScreen.w : mediaW;
        const sH = agentScreen ? agentScreen.h : mediaH;
        return {
          x: Math.max(0, Math.min(sW - 1, Math.round((xi / dW) * sW))),
          y: Math.max(0, Math.min(sH - 1, Math.round((yi / dH) * sH))),
        };
      }
      function attachMouse(el, getSize) {
        el.style.cursor = "default";
        el.addEventListener("contextmenu", (e) => e.preventDefault());
        el.addEventListener("mousemove", (e) => {
          const now = performance.now();
          if (now - lastMove < 1000 / MOUSE_MOVE_HZ) return;
          lastMove = now;
          const s = getSize();
          if (!s) return;
          const p = mapToScreen(el, e.clientX, e.clientY, s.w, s.h);
          if (p) sendCtrl({ type: "mouse_move", x: p.x, y: p.y });
        });
        ["mousedown", "mouseup"].forEach((evt) =>
          el.addEventListener(evt, (e) => {
            e.preventDefault();
            const s = getSize();
            if (!s) return;
            const p = mapToScreen(el, e.clientX, e.clientY, s.w, s.h);
            if (!p) return;
            sendCtrl({
              type: evt === "mousedown" ? "mouse_down" : "mouse_up",
              button: e.button,
              x: p.x,
              y: p.y,
            });
          }),
        );
        el.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            sendCtrl({ type: "mouse_wheel", delta: e.deltaY > 0 ? -120 : 120 });
          },
          { passive: false },
        );
      }

      function isPrintable(e) {
        return (
          e.key && e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey
        );
      }
      window.addEventListener("keydown", (e) => {
        if (!ctrlWs || ctrlWs.readyState !== 1) return;
        if ((e.ctrlKey || e.metaKey) && e.code === "KeyV" && !e.altKey) {
          e.preventDefault();
          (async () => {
            let text = null;
            try {
              if (navigator.clipboard && navigator.clipboard.readText) {
                text = await navigator.clipboard.readText();
              }
            } catch (er) {}
            if (!text && lastPasteText) {
              text = lastPasteText;
              lastPasteText = "";
            }
            if (text) {
              const mods = [
                "ControlLeft",
                "ControlRight",
                "AltLeft",
                "AltRight",
                "MetaLeft",
                "MetaRight",
                "OSLeft",
                "OSRight",
              ];
              const held = mods.filter((c) => heldKeys.has(c));
              for (const c of held) sendCtrl({ type: "key_up", code: c });
              sendCtrl({ type: "clipboard", text: text });
              await new Promise((r) => setTimeout(r, 50));
              sendCtrl({ type: "key_down", code: "ControlLeft" });
              sendCtrl({ type: "key_down", code: "KeyV" });
              sendCtrl({ type: "key_up", code: "KeyV" });
              sendCtrl({ type: "key_up", code: "ControlLeft" });
              for (const c of held) sendCtrl({ type: "key_down", code: c });
            }
          })();
          return;
        }
        if (isPrintable(e)) sendCtrl({ type: "text", text: e.key });
        else if (!heldKeys.has(e.code)) {
          heldKeys.add(e.code);
          sendCtrl({ type: "key_down", code: e.code });
        }
        e.preventDefault();
      });
      window.addEventListener("keyup", (e) => {
        if (!ctrlWs || ctrlWs.readyState !== 1) return;
        if ((e.ctrlKey || e.metaKey) && e.code === "KeyV" && !e.altKey) {
          e.preventDefault();
          return;
        }
        if (heldKeys.has(e.code)) {
          heldKeys.delete(e.code);
          sendCtrl({ type: "key_up", code: e.code });
        }
        e.preventDefault();
      });
      window.addEventListener("blur", () => {
        for (const code of Array.from(heldKeys)) {
          heldKeys.delete(code);
          sendCtrl({ type: "key_up", code: code });
        }
      });
      document.addEventListener("paste", (e) => {
        const text = e.clipboardData && e.clipboardData.getData("text/plain");
        if (text) {
          lastPasteText = text;
          sendCtrl({ type: "clipboard", text: text });
        }
        e.preventDefault();
      });

      // ========= H.264 =========
      function nalType(b) {
        return b & 0x1f;
      }
      async function pickDecoderConfig(codec) {
        const cands = [
          {
            codec: codec,
            hardwareAcceleration: "prefer-hardware",
            optimizeForLatency: true,
          },
          { codec: codec, hardwareAcceleration: "prefer-hardware" },
          { codec: codec, optimizeForLatency: true },
          { codec: codec },
          { codec: codec, hardwareAcceleration: "prefer-software" },
        ];
        for (const cfg of cands) {
          try {
            const r = await VideoDecoder.isConfigSupported(cfg);
            if (r && r.supported) return r.config || cfg;
          } catch (e) {}
        }
        return null;
      }
      function startH264(canvas) {
        if (!("VideoDecoder" in window)) {
          showErr("WebCodecs not supported");
          return;
        }
        const ctx = canvas.getContext("2d");
        let decoder = null,
          initInFlight = false,
          buf = new Uint8Array(0),
          waitingKey = true;
        let frames = 0,
          bytes = 0,
          t0 = performance.now();

        const proto = location.protocol === "https:" ? "wss" : "ws";
        const ws = new WebSocket(
          proto +
            "://" +
            location.host +
            RMM_PREFIX +
            "/ws/stream/h264/" +
            encodeURIComponent(AID),
        );
        ws.binaryType = "arraybuffer";
        ws.onopen = () => (hud.textContent = "h264: connected");
        ws.onclose = () => (hud.textContent = "h264: disconnected");
        ws.onerror = () => showErr("ws error");
        ws.onmessage = (ev) => {
          const add = new Uint8Array(ev.data);
          bytes += add.length;
          if (!add.length) return;
          const m = new Uint8Array(buf.length + add.length);
          m.set(buf, 0);
          m.set(add, buf.length);
          buf = m;
          drainAUs();
        };

        function findStartCodes(d) {
          const out = [];
          let i = 0,
            n = d.length;
          while (i + 3 < n) {
            if (d[i] === 0 && d[i + 1] === 0) {
              if (d[i + 2] === 1) {
                out.push({ pos: i, len: 3 });
                i += 3;
                continue;
              }
              if (i + 3 < n && d[i + 2] === 0 && d[i + 3] === 1) {
                out.push({ pos: i, len: 4 });
                i += 4;
                continue;
              }
            }
            i++;
          }
          return out;
        }
        function drainAUs() {
          const codes = findStartCodes(buf);
          if (codes.length < 2) return;
          const starts = [];
          for (let k = 0; k < codes.length; k++) {
            const c = codes[k];
            const t = nalType(buf[c.pos + c.len]);
            if (t === 9) starts.push(c.pos);
            else if (t === 7 && !starts.length) starts.push(c.pos);
          }
          if (starts.length < 2) return;
          for (let i = 0; i < starts.length - 1; i++)
            handleAU(buf.subarray(starts[i], starts[i + 1]));
          buf = buf.slice(starts[starts.length - 1]);
        }
        function findNALU(au, type) {
          const cs = findStartCodes(au);
          for (const c of cs)
            if (nalType(au[c.pos + c.len]) === type) return c.pos + c.len;
          return -1;
        }
        function codecStr(au) {
          const off = findNALU(au, 7);
          if (off < 0) return "avc1.42E01E";
          const h = (x) => x.toString(16).padStart(2, "0").toUpperCase();
          return "avc1." + h(au[off + 1]) + h(au[off + 2]) + h(au[off + 3]);
        }
        function reset() {
          if (decoder) {
            try {
              decoder.close();
            } catch (e) {}
          }
          decoder = null;
          waitingKey = true;
          initInFlight = false;
        }
        async function init(keyAU) {
          initInFlight = true;
          try {
            const cfg = await pickDecoderConfig(codecStr(keyAU));
            if (!cfg) {
              showErr("no decoder");
              initInFlight = false;
              return;
            }
            const dec = new VideoDecoder({
              output: onFrame,
              error: (e) => {
                showErr("dec: " + e.message);
                reset();
              },
            });
            dec.configure(cfg);
            decoder = dec;
            waitingKey = false;
            dec.decode(
              new EncodedVideoChunk({
                type: "key",
                timestamp: performance.now() * 1000,
                data: keyAU,
              }),
            );
          } catch (e) {
            showErr("init: " + e.message);
            reset();
          } finally {
            initInFlight = false;
          }
        }
        function handleAU(au) {
          const hasIDR = findNALU(au, 5) >= 0,
            hasP = findNALU(au, 1) >= 0;
          if (!hasIDR && !hasP) return;
          const isKey = hasIDR;
          if (!decoder) {
            if (!isKey || initInFlight) return;
            init(new Uint8Array(au));
            return;
          }
          if (decoder.state !== "configured") return;
          if (waitingKey) {
            if (!isKey) return;
            waitingKey = false;
          }
          try {
            decoder.decode(
              new EncodedVideoChunk({
                type: isKey ? "key" : "delta",
                timestamp: performance.now() * 1000,
                data: au,
              }),
            );
          } catch (e) {
            reset();
          }
        }
        function onFrame(frame) {
          if (canvas.width !== frame.displayWidth) {
            canvas.width = frame.displayWidth;
            canvas.height = frame.displayHeight;
          }
          ctx.drawImage(frame, 0, 0);
          frame.close();
          frames++;
          const dt = performance.now() - t0;
          if (dt > 1000) {
            hud.textContent =
              "h264  " +
              ((frames * 1000) / dt).toFixed(1) +
              " fps  " +
              ((bytes * 8) / 1e6 / (dt / 1000)).toFixed(2) +
              " Mbit/s";
            frames = 0;
            bytes = 0;
            t0 = performance.now();
          }
        }
      }

      let mode = null;
      async function start() {
        const a = await getCurrent();
        const cur = (a && a.current && a.current.codec) || "mjpeg";
        mode = cur === "h264" ? "h264" : "mjpeg";
        if (mode === "mjpeg") {
          box.innerHTML =
            '<img id="media" src="' +
            RMM_PREFIX +
            "/stream/mjpeg/" +
            encodeURIComponent(AID) +
            "?t=" +
            Date.now() +
            '">';
          const img = document.getElementById("media");
          attachMouse(img, () => ({
            w: img.naturalWidth,
            h: img.naturalHeight,
          }));
          img.onload = () =>
            (hud.textContent =
              "mjpeg  " + img.naturalWidth + "×" + img.naturalHeight);
        } else {
          box.innerHTML = '<canvas id="media"></canvas>';
          const cv = document.getElementById("media");
          startH264(cv);
          attachMouse(cv, () => ({ w: cv.width, h: cv.height }));
        }
      }
      setInterval(async () => {
        try {
          const a = await getCurrent();
          const now =
            a && a.current && a.current.codec === "h264" ? "h264" : "mjpeg";
          if (now !== mode) location.reload();
        } catch (e) {}
      }, 3000);

      openCtrlWS();
      start();
    </script>
  </body>
</html>
