# nginx/default.conf
upstream sysdm_app {
    server host.docker.internal:8000;
}

upstream sysdm_rmm {
    server rmm:8001;
}

server {
    listen 80;
    server_name dev.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.local;

    ssl_certificate     /etc/letsencrypt/live/dev.local/localhost+2.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.local/localhost+2-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 200M;
    proxy_read_timeout   86400;
    proxy_send_timeout   86400;

    # ---------- Статика FastAPI ----------
    location /static/ {
        alias /app/static/;
    }

    # ---------- Auth subrequests ----------
    location = /_auth_cookie {
        internal;
        proxy_pass              http://sysdm_app/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
    }

    location = /_auth_rmm_agent {
        internal;
        proxy_pass              http://sysdm_app/api/rdp/auth-agent;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
    }

    # ---------- RMM: endpoints агента (auth через agent_token) ----------
    location /rmm-agent/ {
        auth_request /_auth_rmm_agent;

        rewrite ^/rmm-agent/(.*)$ /$1 break;

        proxy_pass              http://sysdm_rmm;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection $connection_upgrade;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      86400;
    }

    # ---------- RMM: endpoints вьюера (auth через cookie JWT админа) ----------
    location /rmm/ {
        auth_request /_auth_cookie;

        rewrite ^/rmm/(.*)$ /$1 break;

        proxy_pass              http://sysdm_rmm;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection $connection_upgrade;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_buffering         off;
        proxy_read_timeout      86400;
    }

    # ---------- FastAPI (всё остальное) ----------
    location / {
        proxy_pass         http://sysdm_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
